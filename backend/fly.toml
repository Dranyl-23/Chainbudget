# fly.toml app configuration file generated for chainbudget-api on 2026-08-19T22:52:28+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'chainbudget-api'
primary_region = 'sin'

[build]
[http_service]
  internal_port = 5001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  interval = '15s'
  timeout = '5s'
  grace_period = '5s'
  method = 'get'
  path = '/api/health'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
