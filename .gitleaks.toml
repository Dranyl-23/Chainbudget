# Gitleaks Configuration — ChainBudgets
title = "ChainBudgets Gitleaks Secret Detection"

[extend]
useDefault = true

[allowlist]
description = "Ignore example template files, test fixtures, and build artifacts"
paths = [
  '''(?i)\.env\.example$''',
  '''(?i)tests?/.*''',
  '''(?i)package-lock\.json$''',
  '''(?i)artifacts/.*''',
  '''(?i)SECURITY_SECRETS_ROTATION\.md$''',
  '''(?i)SECURITY_REMEDIATION\.md$''',
  '''(?i)comprehensive_audit_report\.md$''',
]

regexes = [
  '''0x[a-fA-F0-9]{64}''', # Local mock private key hashes in test files
  '''your_[a-zA-Z0-9_]+_here''', # Template placeholders
]
