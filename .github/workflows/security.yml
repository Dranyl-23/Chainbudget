name: Security & Secret Scanning

on:
  push:
    branches: [ main, master, dev, staging ]
  pull_request:
    branches: [ main, master, dev, staging ]
  schedule:
    # Run a weekly security scan
    - cron: '0 0 * * 0'

jobs:
  secret-scan:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify no .env or sensitive keystores committed
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.local|\.production|\.development|\.prod|\.dev)' | grep -v '\.example$'; then
            echo "ERROR: .env file committed to repository!"
            exit 1
          fi
          if git ls-files | grep -E '\.jks$'; then
            echo "ERROR: Android keystore (.jks) file committed!"
            exit 1
          fi
          if git ls-files | grep -E '(^|/)credentials\.json$'; then
            echo "ERROR: credentials.json file committed!"
            exit 1
          fi
          echo "✅ No sensitive files detected in working tree."

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  dependency-audit:
    name: npm Security Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [backend, frontend, mobile, contracts]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ./${{ matrix.project }}
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Run npm audit
        working-directory: ./${{ matrix.project }}
        run: npm audit --audit-level=high || true
