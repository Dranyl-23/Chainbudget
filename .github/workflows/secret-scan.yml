name: Secret Scanning (Gitleaks)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master, develop]

jobs:
  secret-scan:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch full history so gitleaks can scan all commits, not just HEAD
          fetch-depth: 0

      - name: Run Gitleaks — detect secrets in history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Scan entire git history, not just the staged diff
          args: detect --source . --config .gitleaks.toml --verbose --redact

      - name: Verify no .env files committed
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)'; then
            echo "ERROR: .env file committed to repository!"
            exit 1
          fi
          if git ls-files | grep -E '\.jks$'; then
            echo "ERROR: Android keystore (.jks) file committed!"
            exit 1
          fi
          if git ls-files | grep -E 'credentials\.json$'; then
            echo "ERROR: credentials.json file committed!"
            exit 1
          fi
          echo "✅ No sensitive files detected in working tree."
